<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Minimarket Primavera</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; display: flex;
           justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .caja { background: #fff; padding: 32px; border-radius: 8px; width: 320px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    h1 { font-size: 20px; text-align: center; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2e7d32;
             color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { background: #fdecea; color: #b71c1c; padding: 8px; border-radius: 4px;
             margin-bottom: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Minimarket Primavera</h1>
    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}<div class="error">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label>Usuario</label>
      <input type="text" name="username" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
